<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Beautiful Shop 회원 로그인</title>
<style>
body{font-family:'NanumGothic','Noto Sans CJK KR',sans-serif;margin:0;background:#faf7f2;color:#222}
header{background:#2d3a4a;color:#fff;padding:18px 32px;font-size:26px;font-weight:bold}
header span{font-size:15px;font-weight:normal;opacity:.8;margin-left:10px}
.box{width:380px;margin:40px auto;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:30px 34px}
.box h2{margin:0 0 20px;font-size:22px}
label{display:block;font-size:14px;color:#555;margin:12px 0 6px}
input{width:100%;box-sizing:border-box;padding:11px 12px;font-size:16px;border:1px solid #ced4da;border-radius:8px}
button{width:100%;margin-top:22px;padding:12px;font-size:17px;border:0;border-radius:8px;background:#2d3a4a;color:#fff;cursor:pointer}
#error{color:#e03131;font-size:14px;height:18px;margin:10px 0 0}
ul{list-style:none;display:flex;gap:20px;padding:28px 32px;margin:0}
li{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px;width:200px}
.emoji{font-size:54px;text-align:center;background:#f1ece4;border-radius:8px;padding:8px 0}
h3{font-size:18px;margin:12px 0 6px}
.price{color:#999;text-decoration:line-through;margin:4px 0}
.member-price{color:#1971c2;font-weight:bold;font-size:17px;margin:4px 0}
.welcome{padding:24px 32px 0;font-size:18px}
</style></head>
<body>
<header>Beautiful Shop <span>회원 전용</span></header>
<div id="app">
  <div class="box">
    <h2>🔒 로그인해야 회원가를 볼 수 있어요</h2>
    <label for="username">아이디</label><input id="username" autocomplete="off">
    <label for="password">비밀번호</label><input id="password" type="password">
    <button id="login">로그인</button>
    <p id="error"></p>
  </div>
</div>
<script>
document.getElementById('login').onclick=function(){
  var u=document.getElementById('username').value, p=document.getElementById('password').value;
  if(u!=='reporter'||p!=='beautiful123'){document.getElementById('error').textContent='아이디 또는 비밀번호가 틀렸어요';return;}
  setTimeout(function(){
    var items=[['☕','머그컵','12,000원','9,000원'],['🧣','목도리','25,000원','20,000원'],['🥤','텀블러','22,000원','15,000원']];
    document.getElementById('app').innerHTML='<p class="welcome">👋 reporter 님, 회원 전용 가격입니다</p><ul id="member">'+
      items.map(function(i){return '<li class="item"><div class="emoji">'+i[0]+'</div><h3 class="name">'+i[1]+'</h3><p class="price">'+i[2]+'</p><p class="member-price">회원가 '+i[3]+'</p></li>';}).join('')+'</ul>';
  },600);
};
</script>
</body></html>
